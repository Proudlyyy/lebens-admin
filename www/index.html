<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E5C">
<meta name="description" content="Nie wieder eine Frist verpassen: Ausweis, TÜV, Steuer, Vorsorge und mehr.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lebens-Admin">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}#app{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Lebens-Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: eine Handy-Spalte (max. 520px), Inhalt scrollt, Navigation unten fest in der Spalte */
:root {
  --bg: #F4F6F3; --surface: #FFFFFF; --surface-2: #EEF1ED; --line: #E1E5E0;
  --fg: #18201D; --muted: #56605B; --accent: #0F6E5C; --accent-fg: #FFFFFF; --accent-soft: #E1F0EB;
  --red: #B42318; --red-soft: #FCE8E6; --red-line: #F0C2BC;
  --amber: #9A4608; --amber-soft: #FCEFDF; --note: #FFF7EA; --note-fg: #7F3A05;
  --shadow: 0 6px 18px rgba(15, 110, 92, .28);
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #1A211E; --surface-2: #222B27; --line: #2C3632;
  --fg: #E8EEEA; --muted: #A2ADA7; --accent: #4CC2A5; --accent-fg: #06261F; --accent-soft: #173A31;
  --red: #FF8A7E; --red-soft: #3A1E1B; --red-line: #6B2C25;
  --amber: #F2B26B; --amber-soft: #3A2A17; --note: #2A2318; --note-fg: #F2C48A;
  --shadow: 0 6px 18px rgba(0, 0, 0, .45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1A211E; --surface-2: #222B27; --line: #2C3632;
  --fg: #E8EEEA; --muted: #A2ADA7; --accent: #4CC2A5; --accent-fg: #06261F; --accent-soft: #173A31;
  --red: #FF8A7E; --red-soft: #3A1E1B; --red-line: #6B2C25;
  --amber: #F2B26B; --amber-soft: #3A2A17; --note: #2A2318; --note-fg: #F2C48A;
  --shadow: 0 6px 18px rgba(0, 0, 0, .45); color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; -webkit-font-smoothing: antialiased; }
#app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.scroll { flex: 1; overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 110px; display: flex; flex-direction: column; gap: 12px; }
.scroll.plain { padding-bottom: 28px; }
h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; }
h2 { margin: 12px 0 0; font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
h2.red { color: var(--red); }
p { margin: 0; line-height: 1.5; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }

/* Kopf */
.top { display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--surface); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.iconbtn svg { width: 22px; height: 22px; }

/* Zusammenfassung */
.hero { background: var(--accent); color: var(--accent-fg); border-radius: var(--r); padding: 16px 18px; display: flex; justify-content: space-between; gap: 12px; }
.hero div { display: flex; flex-direction: column; gap: 2px; }
.hero b { font-size: 32px; font-weight: 800; line-height: 1; }
.hero span { font-size: 14px; font-weight: 600; }
.hero div:last-child { align-items: flex-end; text-align: right; }

/* Eintrags-Karte */
.row { width: 100%; text-align: left; border: 1.5px solid transparent; background: var(--surface); border-radius: 14px; padding: 12px 12px 12px 14px; display: flex; gap: 12px; align-items: center; }
.row.overdue { border-color: var(--red-line); }
.ico { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--accent-soft); color: var(--accent); }
.ico svg { width: 22px; height: 22px; }
.overdue .ico { background: var(--red-soft); color: var(--red); }
.now .ico, .soon .ico { background: var(--amber-soft); color: var(--amber); }
.missing .ico { background: var(--surface-2); color: var(--muted); }
.rowtext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rowtext b { font-size: 16px; font-weight: 700; }
.rowtext span { font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 99px; white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
.overdue .pill { background: var(--red-soft); color: var(--red); }
.now .pill, .soon .pill { background: var(--amber-soft); color: var(--amber); }
.missing .pill { background: var(--surface-2); color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 8px; }

/* Buttons */
.btn { min-height: 54px; border-radius: 16px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 16.5px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; width: 100%; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn.danger { background: var(--red); color: #FFFFFF; }
.btn.small { min-height: 44px; font-size: 15px; width: auto; }
.linkbtn { background: none; border: 0; padding: 10px 0; color: var(--accent); font-weight: 700; font-size: 15px; }
.choice { min-height: 58px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16.5px; font-weight: 600; text-align: left; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.choice small { display: block; font-size: 13px; color: var(--muted); font-weight: 500; margin-top: 2px; }
.choice[aria-pressed="true"] { border: 2px solid var(--accent); padding: 11.5px 17.5px; }
.choice .check { width: 22px; height: 22px; color: var(--accent); visibility: hidden; flex-shrink: 0; }
.choice[aria-pressed="true"] .check { visibility: visible; }

/* Onboarding */
.progress { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
.qicon { width: 68px; height: 68px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; margin-top: 28px; }
.qicon svg { width: 36px; height: 36px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 700; }
.input { min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 17px; width: 100%; box-sizing: border-box; }
.input:focus { border-color: var(--accent); outline: none; }
.err { color: var(--red); font-size: 14px; font-weight: 600; }
.foot { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 20px; }

/* Detail */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.chip.must { background: var(--red-soft); color: var(--red); }
.panel { background: var(--surface); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.bigdate { font-size: 32px; font-weight: 800; letter-spacing: -.02em; }
.rel { font-size: 15px; font-weight: 700; color: var(--accent); }
.rel.overdue { color: var(--red); }
.props { background: var(--surface); border-radius: 18px; display: flex; flex-direction: column; }
.prop { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; min-height: 30px; border-bottom: 1px solid var(--line); }
.prop:last-child { border-bottom: 0; }
.prop span:first-child, .prop label { color: var(--muted); font-size: 15px; }
.prop b { font-size: 15px; text-align: right; }
.prop select, .prop input { border: 0; background: var(--surface-2); border-radius: 10px; min-height: 40px; padding: 0 10px; font-size: 15px; font-weight: 700; max-width: 60%; }
.note { background: var(--note); border-radius: 18px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
.note strong { color: var(--note-fg); font-size: 14px; }
.note p { font-size: 14.5px; }
.confirm { background: var(--red-soft); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.confirm .btns { display: flex; gap: 8px; }

/* Bereiche */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--surface); border: 1.5px solid transparent; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 112px; }
.tile.alert { border-color: var(--red-line); }
.tile b { font-size: 16px; }
.tile span { font-size: 13px; color: var(--muted); }
.tile.alert span { color: var(--red); font-weight: 600; }
.tile.add { border: 2px dashed var(--line); background: transparent; align-items: center; justify-content: center; color: var(--accent); font-weight: 700; }

/* Kalender */
.month { display: flex; flex-direction: column; gap: 8px; }
.cal { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 14px; padding: 10px 14px; text-align: left; border: 0; width: 100%; }
.cal .day { width: 40px; text-align: center; display: flex; flex-direction: column; flex-shrink: 0; }
.cal .day b { font-size: 20px; line-height: 1.1; }
.cal .day span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }

/* Navigation + FAB */
nav.tabs { flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 64px; padding: 6px 0; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 800; }
nav.tabs svg { width: 24px; height: 24px; }
.fab { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-fg); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
.fab svg { width: 26px; height: 26px; }
.toast { position: absolute; left: 16px; right: 16px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14.5px; font-weight: 600; box-shadow: var(--shadow); }
.toast button { background: none; border: 0; color: inherit; font-weight: 800; text-decoration: underline; padding: 8px 0; }
.banner { background: var(--amber-soft); color: var(--amber); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.banner button { background: none; border: 0; color: inherit; font-weight: 800; text-decoration: underline; padding: 6px 0; }
.empty { background: var(--surface); border-radius: 16px; padding: 18px; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
